name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-client-linux:
    name: Build Client (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libglm-dev nlohmann-json3-dev xorg-dev libxkbcommon-dev

      - name: Configure CMake
        run: cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build client/build --config Release -j$(nproc)

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaviro-client-linux
          path: client/build/zaviro_client

  build-client-windows:
    name: Build Client (Windows cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker cross-compilation image
        run: docker build -t zaviro-cross-build docker/cross-build/

      - name: Cross-compile client for Windows
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src:ro \
            -v ${{ github.workspace }}/client/build-win64:/out \
            zaviro-cross-build \
            bash -c '
              set -e
              mkdir -p /build/client
              cp -r /src/client/CMakeLists.txt /build/client/
              cp -r /src/client/include /build/client/
              cp -r /src/client/src /build/client/
              cp -r /src/client/third_party /build/client/
              cp -r /src/client/cmake /build/client/

              cd /build/client
              cmake -S . -B build-win64 \
                -DCMAKE_TOOLCHAIN_FILE=/build/client/cmake/mingw-toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release

              cmake --build build-win64 -j$(nproc)
              cp build-win64/zaviro_client.exe /out/
            '

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaviro-client-windows
          path: client/build-win64/zaviro_client.exe

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-client-linux, build-client-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Bundle Linux
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p dist
          cp artifacts/zaviro-client-linux/zaviro_client dist/zaviro_client_linux
          chmod +x dist/zaviro_client_linux
          tar czf "zaviro-linux-x64-${VERSION}.tar.gz" -C dist zaviro_client_linux

      - name: Bundle Windows
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p dist
          cp artifacts/zaviro-client-windows/zaviro_client.exe dist/
          tar czf "zaviro-windows-x64-${VERSION}.tar.gz" -C dist zaviro_client.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zaviro ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            zaviro-linux-x64-*.tar.gz
            zaviro-windows-x64-*.tar.gz
